<template id="cookie-consent-banner">
<div class="cookie-consent-text">
    <span data-i18n="cookie.description">本应用使用必要登录 Cookie 保持会话；可选 Cookie 用于记住上次用户名和房间偏好。</span>
</div>
<div class="cookie-consent-actions">
    <button type="button" class="btn btn-sm btn-outline-secondary" id="declineCookieConsent" data-i18n="cookie.necessary_only">仅必要 Cookie</button>
    <button type="button" class="btn btn-sm btn-primary" id="acceptCookieConsent" data-i18n="cookie.accept">同意</button>
</div>
</template>
