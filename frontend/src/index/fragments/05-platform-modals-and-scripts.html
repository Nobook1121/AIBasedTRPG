    <div class="modal fade" id="addModelModal" tabindex="-1" aria-labelledby="addModelModalLabel" aria-hidden="true">
        <div class="modal-dialog" style="max-width: 500px;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addModelModalLabel">添加模型</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="modelName" class="form-label">模型名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="modelName" placeholder="请输入模型名称" maxlength="50">
                        <div class="invalid-feedback" id="modelNameError"></div>
                    </div>
                    <div class="form-group mt-3">
                        <label for="modelId" class="form-label">模型ID <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="modelId" placeholder="请输入模型ID" maxlength="100">
                        <div class="invalid-feedback" id="modelIdError"></div>
                    </div>
                    <div class="form-group mt-3">
                        <label for="modelDescription" class="form-label">模型描述</label>
                        <textarea class="form-control" id="modelDescription" rows="3" placeholder="请输入模型描述" maxlength="200"></textarea>
                        <div class="invalid-feedback" id="modelDescriptionError"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="addModelBtn" disabled>确认</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addProviderModal" tabindex="-1" aria-labelledby="addProviderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProviderModalLabel">添加大模型提供商</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="provider-form-grid">
                        <div class="form-group">
                            <label for="providerName" class="form-label">提供商名称 <span class="text-danger">*</span> <span class="field-help" tabindex="0" title="显示在平台卡片和角色配置下拉框里的名称。">?</span></label>
                            <input type="text" class="form-control" id="providerName" maxlength="60" placeholder="例如 My Gateway">
                        </div>
                        <div class="form-group">
                            <label for="providerId" class="form-label">提供商 ID <span class="text-danger">*</span> <span class="field-help" tabindex="0" title="保存为配置文件名，只能使用英文、数字、短横线或下划线。">?</span></label>
                            <input type="text" class="form-control" id="providerId" maxlength="60" placeholder="my-gateway">
                        </div>
                        <div class="form-group">
                            <label for="providerApiFormat" class="form-label">接口规范 <span class="field-help" tabindex="0" title="选择服务商的请求格式。AnythingLLM 会使用 /api/v1/workspace/{slug}/chat。">?</span></label>
                            <select class="form-select" id="providerApiFormat">
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Anthropic</option>
                                <option value="anythingllm">AnythingLLM</option>
                                <option value="custom">自定义请求</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="providerTimeout" class="form-label">超时（秒） <span class="field-help" tabindex="0" title="等待服务商返回的最长秒数。">?</span></label>
                            <input type="number" class="form-control" id="providerTimeout" min="10" max="300" value="30">
                        </div>
                        <div class="form-group provider-form-span">
                            <label for="providerApiKey" class="form-label">API Key <span class="field-help" tabindex="0" title="填写服务商访问令牌。AnythingLLM 在实例设置里生成 API Key。">?</span></label>
                            <input type="password" class="form-control" id="providerApiKey" autocomplete="off">
                        </div>
                        <div class="form-group provider-form-span">
                            <label for="providerBaseUrl" class="form-label">Base URL <span class="text-danger">*</span> <span class="field-help" tabindex="0" title="接口根地址。AnythingLLM 填 http://localhost:3001/api/v1；OpenAI 兼容服务通常填 https://host/v1。">?</span></label>
                            <input type="text" class="form-control" id="providerBaseUrl" placeholder="例如 http://localhost:3001/api/v1">
                        </div>
                        <div class="form-group provider-form-span">
                            <label for="providerEndpointUrl" class="form-label">完整 Endpoint URL <span class="field-help" tabindex="0" title="通常留空。只有服务商路径不标准时才填写完整请求地址。">?</span></label>
                            <input type="text" class="form-control" id="providerEndpointUrl" placeholder="留空时按接口规范从 Base URL 生成">
                        </div>
                        <div class="form-group">
                            <label for="providerModelName" class="form-label">默认模型名称 <span class="text-danger">*</span> <span class="field-help" tabindex="0" title="显示用名称。AnythingLLM 可填工作区名称。">?</span></label>
                            <input type="text" class="form-control" id="providerModelName" maxlength="80" placeholder="默认模型">
                        </div>
                        <div class="form-group">
                            <label for="providerModelId" class="form-label">默认模型 ID <span class="text-danger">*</span> <span class="field-help" tabindex="0" title="OpenAI/Anthropic 填模型 ID；AnythingLLM 填 workspace slug。">?</span></label>
                            <input type="text" class="form-control" id="providerModelId" maxlength="160" placeholder="模型 ID 或 AnythingLLM workspace slug">
                        </div>
                        <div class="form-group provider-anythingllm-field provider-form-span">
                            <label for="providerWorkspaceSlug" class="form-label">AnythingLLM Workspace Slug <span class="field-help" tabindex="0" title="填写 AnythingLLM 工作区 URL 里的 slug。例如 /workspace/my-room 填 my-room。">?</span></label>
                            <input type="text" class="form-control" id="providerWorkspaceSlug" maxlength="160" placeholder="例如 my-workspace">
                        </div>
                        <div class="form-group provider-custom-field provider-form-span">
                            <label for="providerHeadersJson" class="form-label">自定义 Headers JSON <span class="field-help" tabindex="0" title="自定义请求时填写额外请求头 JSON，例如 {&quot;X-Custom&quot;:&quot;value&quot;}。">?</span></label>
                            <textarea class="form-control provider-code-input" id="providerHeadersJson" rows="4" spellcheck="false" placeholder="{&quot;X-Custom&quot;:&quot;value&quot;}"></textarea>
                        </div>
                        <div class="form-group provider-custom-field provider-form-span">
                            <label for="providerRequestTemplate" class="form-label">请求 Body 模板 JSON <span class="field-help" tabindex="0" title="自定义请求时填写 JSON 模板，支持 {{model}}、{{last_user_message}}、{{messages}}。">?</span></label>
                            <textarea class="form-control provider-code-input" id="providerRequestTemplate" rows="7" spellcheck="false" placeholder="{&quot;model&quot;:&quot;{{model}}&quot;,&quot;prompt&quot;:&quot;{{last_user_message}}&quot;}"></textarea>
                        </div>
                        <div class="form-group provider-custom-field provider-form-span">
                            <label for="providerResponsePath" class="form-label">响应文本路径 <span class="field-help" tabindex="0" title="自定义响应里助手文本的位置，例如 choices.0.message.content 或 textResponse。">?</span></label>
                            <input type="text" class="form-control" id="providerResponsePath" placeholder="choices.0.message.content">
                        </div>
                    </div>
                    <div class="settings-message mt-3" id="addProviderMessage" aria-live="polite"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="addProviderBtn" disabled>添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- API测试模态窗口 -->
    <div class="modal fade" id="apiTestModal" tabindex="-1" aria-labelledby="apiTestModalLabel" aria-hidden="true">
        <div class="modal-dialog" style="max-width: 600px;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="apiTestModalLabel">API连接测试</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="test-status mb-4">
                        <div id="testStatus" class="d-none">
                            <div class="test-status-indicator test-status-pending mb-2"></div>
                            <p class="test-status-text">测试中...</p>
                        </div>
                        <div id="testResult" class="d-none">
                            <div class="test-status-indicator test-status-success mb-2"></div>
                            <p class="test-status-text test-status-success-text">测试成功</p>
                        </div>
                        <div id="testError" class="d-none">
                            <div class="test-status-indicator test-status-error mb-2"></div>
                            <p class="test-status-text test-status-error-text">测试失败</p>
                            <p id="errorMessage" class="text-sm text-muted mt-2"></p>
                        </div>
                    </div>
                    <div id="testDetails" class="d-none">
                        <h6>测试详情</h6>
                        <div class="test-details-grid">
                            <div class="test-detail-item">
                                <span class="test-detail-label">测试时间：</span>
                                <span id="testTime" class="test-detail-value"></span>
                            </div>
                            <div class="test-detail-item">
                                <span class="test-detail-label">测试类型：</span>
                                <span class="test-detail-value">文本对话测试</span>
                            </div>
                            <div class="test-detail-item">
                                <span class="test-detail-label">模型类型：</span>
                                <span id="testModel" class="test-detail-value"></span>
                            </div>
                            <div class="test-detail-item">
                                <span class="test-detail-label">平均速度：</span>
                                <span id="testSpeed" class="test-detail-value"></span>
                            </div>
                            <div class="test-detail-item">
                                <span class="test-detail-label">测试消耗：</span>
                                <span id="testConsumption" class="test-detail-value"></span>
                            </div>
                        </div>
                    </div>
                    <div id="testLoading" class="d-none">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-2">正在测试API连接...</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="reTestBtn" style="display: none;">重新测试</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 平台配置模态窗口 -->
    <div class="modal fade" id="platformConfigModal" tabindex="-1" aria-labelledby="platformConfigModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="platformConfigModalLabel">平台配置</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="platformConfigContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="savePlatformConfigBtn">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 回档节点预览模态窗口 -->
    <div class="modal fade" id="saveNodePreviewModal" tabindex="-1" aria-labelledby="saveNodePreviewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="saveNodePreviewModalLabel">回档节点预览</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="saveNodePreviewContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="loadNodeFromPreviewBtn">回档到此节点</button>
                </div>
            </div>
        </div>
    </div>
